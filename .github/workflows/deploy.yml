name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Forces the Pages source to "GitHub Actions". Without this the legacy
      # branch builder can stay enabled, serve the repo root as-is, and ship an
      # index.html that points at /src/main.jsx — a blank page in the browser.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the built site is what Pages serves
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -sS --max-time 30 "$PAGE_URL" || true)
            if printf '%s' "$body" | grep -q 'assets/index-'; then
              echo "OK: serving the built bundle."
              exit 0
            fi
            echo "Attempt $attempt: built assets not found yet, retrying..."
            sleep $((attempt * 10))
          done
          echo "::error::$PAGE_URL is not serving the built bundle."
          printf '%s' "$body" | head -40
          exit 1
