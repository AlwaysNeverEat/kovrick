name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Checked repeatedly over ~2 minutes rather than once: a competing
      # deployment can land after ours, so a single early probe passes while
      # the live site is already broken again.
      - name: Verify the built site is what Pages serves
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          streak=0
          for attempt in $(seq 1 8); do
            sleep 15
            body=$(curl -sS --max-time 30 "$PAGE_URL" || true)
            if printf '%s' "$body" | grep -q 'assets/index-'; then
              streak=$((streak + 1))
              echo "Probe $attempt: built bundle served (stable for $streak)."
              if [ "$streak" -ge 3 ]; then
                echo "OK: deployment is stable."
                exit 0
              fi
            else
              streak=0
              echo "Probe $attempt: built assets missing."
            fi
          done
          echo "::error::$PAGE_URL is not stably serving the built bundle. \
          If the HTML below is the repo's source index.html, the legacy branch \
          builder is overwriting this deployment: set Settings -> Pages -> \
          Source to 'GitHub Actions'. That setting cannot be changed from a \
          workflow — GITHUB_TOKEN is not an admin token."
          printf '%s' "$body" | head -40
          exit 1
