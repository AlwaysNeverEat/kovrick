name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Switches the Pages source to "GitHub Actions". The legacy branch
      # builder otherwise stays enabled, races this workflow, and wins — it
      # serves the repo root as-is, so index.html still points at
      # /src/main.jsx and the browser gets a blank page. configure-pages
      # alone does not do this: its `enablement` input only creates a site
      # that does not exist yet and leaves an existing build_type untouched.
      - name: Force Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "PATCH /pages -> $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            cat /tmp/pages.json
            echo "::error::Could not set the Pages build type to 'workflow'."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Checked repeatedly over ~2 minutes rather than once: a competing
      # deployment can land after ours, so a single early probe passes while
      # the live site is already broken again.
      - name: Verify the built site is what Pages serves
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          streak=0
          for attempt in $(seq 1 8); do
            sleep 15
            body=$(curl -sS --max-time 30 "$PAGE_URL" || true)
            if printf '%s' "$body" | grep -q 'assets/index-'; then
              streak=$((streak + 1))
              echo "Probe $attempt: built bundle served (stable for $streak)."
              if [ "$streak" -ge 3 ]; then
                echo "OK: deployment is stable."
                exit 0
              fi
            else
              streak=0
              echo "Probe $attempt: built assets missing."
            fi
          done
          echo "::error::$PAGE_URL is not stably serving the built bundle."
          printf '%s' "$body" | head -40
          exit 1
